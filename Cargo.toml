[workspace]
resolver = "3"
members = ["crates/ricochet-protocole", "crates/ricochet-agent", "crates/ricochet-serveur"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
authors = ["mawena"]
repository = "https://github.com/mawena/Ricochet"

[workspace.dependencies]
ricochet-protocole = { path = "crates/ricochet-protocole" }
ricochet-serveur = { path = "crates/ricochet-serveur" }

tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Fournisseur de chiffrement de rustls : tokio-tungstenite n'en active aucun.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
clap = { version = "4.6", features = ["derive"] }
sysinfo = "0.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
argon2 = "0.6"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2.11"
portable-pty = "0.9"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rpassword = "7.5"
# Web Push (RFC 8291 et 8292) : RustCrypto, sans OpenSSL.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "std"] }
hkdf = "0.12"
aes-gcm = "0.10"
# hkdf 0.12 et p256 0.13 s'appuient sur la génération 0.10 de sha2 (le reste du dépôt est en 0.11).
sha2-010 = { package = "sha2", version = "0.10" }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "1"

[profile.release]
lto = "thin"
strip = true
