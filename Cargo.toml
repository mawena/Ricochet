[workspace]
resolver = "3"
members = ["crates/ricochet-protocole", "crates/ricochet-agent", "crates/ricochet-serveur"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["mawena"]
repository = "https://github.com/mawena/Ricochet"

[workspace.dependencies]
ricochet-protocole = { path = "crates/ricochet-protocole" }
ricochet-serveur = { path = "crates/ricochet-serveur" }

tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
clap = { version = "4.6", features = ["derive"] }
sysinfo = "0.40"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
argon2 = "0.6"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2.11"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
rpassword = "7.5"

[profile.release]
lto = "thin"
strip = true
