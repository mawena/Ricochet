# Configuration du relais : /etc/ricochet/serveur.toml
# Les machines et les comptes opérateur ne sont pas ici : ils vivent dans la base de données.
# Comptes : `sudo -u ricochet ricochet-serveur compte ajouter <nom>` ; machines : interface web.

# Adresse d'écoute, locale : nginx assure le HTTPS devant.
ecoute = "127.0.0.1:7870"

# Base SQLite (comptes, sessions, machines, journal d'audit).
base = "/var/lib/ricochet/ricochet.db"

# Durée de vie d'une session de l'interface, en heures.
duree_session_h = 12

# Cookie de session réservé au HTTPS. Mettre false seulement pour un essai local en HTTP.
cookie_securise = true

# Période d'envoi de l'état par les agents, en secondes.
intervalle_etat_s = 30

# Facultatif : empreinte d'un jeton pour appeler l'API depuis un script
# (`ricochet-serveur jeton`, puis `Authorization: Bearer <jeton>`).
# jeton_operateur_sha256 = "empreinte-de-64-caracteres"

# Facultatif : empreinte d'un jeton qui ne permet que de lister les machines et d'ouvrir des
# tunnels (`ricochet-agent tunnel`, utilisé par CCS). Il ne donne ni terminal, ni fichiers, ni
# gestion des machines. Même commande : `ricochet-serveur jeton`.
# jeton_tunnel_sha256 = "empreinte-de-64-caracteres"

# Facultatif : mode Portier de l'interface web (connexion unique de mawena.cloud).
# Désactivé par défaut. Activé, la page `/` ouvre une session sans mot de passe ni TOTP quand
# nginx (sur la même machine) transmet un seul en-tête X-Portier-Utilisateur dont la valeur est
# dans `utilisateurs`. Jamais pour /agent ni l'API par jeton. Voir le README (« Mode Portier »).
# [portier]
# actif = true
# utilisateurs = ["charles-gamligo"]
# url = "https://portier.mawena.cloud"
# deconnexion = "https://portier.mawena.cloud/"   # facultatif, `<url>/` par défaut

# Messages des machines (envoyés par les programmes de chaque machine, via son agent).
# [messages]
# conservation_jours = 30     # suppression des messages du relais après ce délai
# limite_par_minute = 20      # par machine ; au-delà : gardés, mais sans notification
# delai_detail_s = 15         # attente maximale du détail demandé à l'agent

# Notifications Web Push vers les appareils de l'opérateur (iPhone, Android, Chrome). Sans
# url_publique, le relais ne pousse rien : l'adresse publique va dans la revendication `sub` des
# jetons VAPID (les clés VAPID sont créées au premier démarrage et gardées dans la base).
# [push]
# url_publique = "https://ricochet.mawena.cloud"
# ttl_s = 86400               # un appareil éteint reçoit la notification à son retour, sous 24 h
# Hôtes de push joignables (défaut : fcm.googleapis.com, *.push.apple.com,
# *.push.services.mozilla.com, *.notify.windows.com, *.push.microsoft.com).
# hotes_autorises = ["fcm.googleapis.com", "*.push.apple.com"]
# autoriser_http = false      # réservé aux essais : http:// et adresses locales
