# Configuration de l'agent : /etc/ricochet/agent.toml (droits 600, il contient le jeton).

relais = "wss://ricochet.mawena.cloud/agent"
id = "pc"
jeton = "remplacer-par-le-jeton"

# Terminal à distance : retirer les « # » pour l'activer. Sans cette section, l'agent refuse
# d'ouvrir un terminal. L'agent tourne en root : préférer le shell d'un utilisateur.
# [terminal]
# commande = ["runuser", "-l", "charles"]
# maximum = 8

# Fichiers (parcourir, télécharger, envoyer) : retirer les « # » pour les activer. Avec
# `utilisateur`, l'agent n'a sur les fichiers que les droits de cet utilisateur, et les fichiers
# reçus lui appartiennent ; sans, il agit en root.
# [fichiers]
# utilisateur = "charles"

# Tunnels : retirer les « # » pour permettre de joindre des ports locaux de cette machine en
# passant par le relais (`ricochet-agent tunnel <machine>` depuis une autre machine). Seuls les
# ports listés sont joignables, sur 127.0.0.1. Avec 22 : SSH, donc aussi rsync et scp ; c'est
# alors le serveur SSH de la machine qui décide qui entre (clés autorisées).
# [tunnel]
# ports = [22]
# maximum = 16

# Messages des programmes de la machine vers mes appareils (notification, détail, boutons de
# réponse) : retirer les « # » pour activer le socket Unix. Seuls les comptes listés (et root)
# peuvent y parler ; le contrôle se fait par l'identité du processus (SO_PEERCRED).
# Envoi : `ricochet-agent message envoyer --source mon-programme --titre "…"` (voir le README).
# [messages]
# utilisateurs = ["charles"]
# socket = "/run/ricochet-agent/messages.sock"
# conservation_jours = 30                 # durée de garde des messages et détails sur la machine
# dossier_etat = "/var/lib/ricochet-agent"   # file d'attente persistante (0700)

# Applications web locales ouvertes depuis l'interface du relais (voir le README, « Applications
# web des machines ») : une section par application, retirer les « # » pour l'activer. Seuls les
# ports déclarés sont joignables, sur 127.0.0.1. Les en-têtes sont ajoutés à chaque requête : le
# jeton d'accès reste sur la machine (ce fichier est en 0600).
# [applis.cofiticket]
# port = 8790
# libelle = "CofiTicket"
# [applis.cofiticket.entetes]
# Cookie = "cofiticket=<jeton>"
