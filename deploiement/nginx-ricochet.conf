# À placer dans le bloc `server` HTTPS de ricochet.mawena.cloud.
# Le navigateur n'utilisera plus que le HTTPS pour ce domaine (le cookie de session l'exige).
add_header Strict-Transport-Security "max-age=31536000" always;

location / {
    proxy_pass http://127.0.0.1:7870;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Les agents restent connectés en permanence : pings toutes les 20 s.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

